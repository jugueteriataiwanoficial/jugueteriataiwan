# ==================================================================
# SYNC MERCADO LIBRE (canal ML del hub) — Fases 0-2.
#
# Despachado SOLO a mano (workflow_dispatch) hasta validar los
# payloads y la primera publicacion:
#   Actions -> sync-ml -> Run workflow -> "publicar" = cuantos items
#   nuevos crear en esta corrida (0 = solo sincronizar).
#
# Reutiliza el mismo patron de sync-top300: costos cifrados en el repo
# (costos.posgold.enc) y .env armado desde secrets. El refresh token de
# ML ROTA en cada uso, por lo que NO vive solo en un secret: el script
# lo renueva y lo deja cifrado en hub/ml_token.enc, que este workflow
# commitea para la siguiente corrida.
#
# Secrets requeridos (aparte de los de POSGold ya existentes):
#   ML_CLIENT_ID / ML_CLIENT_SECRET  de la app en developers.mercadolibre
#   ML_TOKEN_KEY                     llave AES para ml_token.enc
#   ML_REFRESH_TOKEN                 solo la primera vez (opcional si ya
#                                    existe hub/ml_token.enc commiteado)
# ==================================================================
name: sync-ml

on:
  schedule:
    - cron: "15 12,13,0,1 * * *"  # 07:15, 08:15, 19:15, 20:15 CO (igual que sync-top300)
  workflow_dispatch:
    inputs:
      publicar:
        description: "Cuantos productos nuevos publicar (0 = solo sincronizar)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: sync-ml
  cancel-in-progress: false

jobs:
  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias del hub
        run: pip install -r hub/requirements.txt

      - name: Verificar mapas ML versionados
        run: |
          test -s data/categorias_ml.json
          test -s data/marcas_ml.json

      - name: Descifrar costos de POSGold
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in costos.posgold.enc -out PRODUCTOS_cloud.xlsx \
            -pass env:COSTOS_KEY
          echo "costos descifrados: $(stat -c%s PRODUCTOS_cloud.xlsx) bytes"
        env:
          COSTOS_KEY: ${{ secrets.COSTOS_KEY }}

      - name: Crear .env desde secrets
        run: |
          printf 'POSGOLD_BASE=https://jugueteriataiwan.goldpos.com.co\n' >> .env
          printf 'POSGOLD_TOKEN_USER=%s\n' "$POSGOLD_TOKEN_USER" >> .env
          printf 'POSGOLD_TOKEN_PASS=%s\n' "$POSGOLD_TOKEN_PASS" >> .env
          printf 'POSGOLD_EMPRESAID=1\nPOSGOLD_USUARIOID=1\nPOSGOLD_BODEGAID=2\n' >> .env
          printf 'TOP300_CANTIDAD=99999\nRANKING=margen_costo\nCOSTO_CAMPO=costopromedio\n' >> .env
          printf 'ML_SITE_ID=MCO\n' >> .env
          printf 'ML_CLIENT_ID=%s\n' "$ML_CLIENT_ID" >> .env
          printf 'ML_CLIENT_SECRET=%s\n' "$ML_CLIENT_SECRET" >> .env
          if [ -n "$ML_REFRESH_TOKEN" ]; then printf 'ML_REFRESH_TOKEN=%s\n' "$ML_REFRESH_TOKEN" >> .env; fi
        env:
          POSGOLD_TOKEN_USER: ${{ secrets.POSGOLD_TOKEN_USER }}
          POSGOLD_TOKEN_PASS: ${{ secrets.POSGOLD_TOKEN_PASS }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}

      - name: Construir catalogo maestro del hub
        run: python hub/construir_hub.py --costos PRODUCTOS_cloud.xlsx

      - name: QA offline del adaptador ML
        run: python qa_ml.py

      - name: Sincronizar y publicar en Mercado Libre
        run: python hub/canal_ml.py --sincronizar --publicar "${{ inputs.publicar }}"
        env:
          ML_TOKEN_KEY: ${{ secrets.ML_TOKEN_KEY }}
          GIT_AUTHOR_NAME: sync-hub
          GIT_AUTHOR_EMAIL: actions@github.com
          GIT_COMMITTER_NAME: sync-hub
          GIT_COMMITTER_EMAIL: actions@github.com

      - name: Commitear estado del canal y token rotado
        run: |
          git config user.name sync-hub
          git config user.email actions@github.com
          git add data/canal_ml.json hub/ml_token.enc || true
          git commit -m "sync-ml: canal actualizado ($(date -u +%Y-%m-%d\ %H:%M) UTC)" || echo "sin cambios"
          git push origin HEAD:"${GITHUB_REF_NAME:-main}"
